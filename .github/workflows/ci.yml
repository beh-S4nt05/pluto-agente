name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # PT-BR no console do Windows não pode morrer em UnicodeEncodeError
      PYTHONUTF8: "1"
      PLUTO_MOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # V9.0.0 (P6): bwrap no runner Linux — a suíte (T251) prova a
      # jaula de kernel DE VERDADE em cada push (escrever fora falha,
      # net off não conecta). Sem bwrap (win/mac) a suíte degrada honesta.
      - name: Instalar bubblewrap (Linux — prova do sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Instalar (pacote + ruff)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff

      - name: "Portão 1/3 — ruff (lint)"
        run: ruff check --select E9,F,B,PLE .

      - name: "Portão 2/3 — suíte (tests/run_all.py)"
        run: python tests/run_all.py
        timeout-minutes: 20

      - name: "Portão 3/3 — varredura (segredos/dados pessoais)"
        run: pluto varredura --tudo

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: ${{ matrix.os }} (py ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.13"]
        include:
          # P8.3 (auditoria M11): pyproject promete >=3.9 — o CI agora
          # cobre 3.11 + 3.13 no Linux (3.9/3.10: declarado como análise
          # estática em docs/PORTABILIDADE.md)
          - os: ubuntu-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # PT-BR no console do Windows não pode morrer em UnicodeEncodeError
      PYTHONUTF8: "1"
      PLUTO_MOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # V9.0.0 (P6): bwrap no runner Linux — a suíte (T251) prova a
      # jaula de kernel DE VERDADE em cada push (escrever fora falha,
      # net off não conecta). Sem bwrap (win/mac) a suíte degrada honesta.
      # Ubuntu 24.04 restringe userns não-privilegiado (AppArmor) —
      # libera no runner para o probe funcionar (lição do run 42555505782).
      - name: Instalar bubblewrap (Linux — prova do sandbox)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc true && echo "userns OK" || echo "userns BLOQUEADO"

      - name: Instalar (pacote + ruff + coverage)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff coverage

      - name: "Portão 1/4 — ruff (lint)"
        run: ruff check --select E9,F,B,PLE .

      - name: "Portão 2/4 — suíte (tests/run_all.py)"
        run: python tests/run_all.py
        timeout-minutes: 20

      - name: "Portão 3/4 — varredura (segredos/dados pessoais)"
        run: pluto varredura --tudo

      # V9.0.0 (F0 · RF-INF-06): gate de cobertura — floor 66%,
      # RATCHET que só sobe (floor = máximo já alcançado −2 pts de
      # folga; subir o floor é commit consciente, nunca acidente).
      # Medido do MESMO jeito que o baseline
      # (docs/COBERTURA-BASELINE-2026-11-11.txt = 68%):
      # coverage run --source=pluto tests/run_all.py. Só no job
      # canônico ubuntu 3.13 — os outros SOs provam portabilidade.
      - name: "Portão 4/4 — cobertura (F0: floor 66%, ubuntu 3.13)"
        if: runner.os == 'Linux' && matrix.python-version == '3.13'
        run: |
          coverage run --source=pluto tests/run_all.py
          coverage report --fail-under=66
        timeout-minutes: 20

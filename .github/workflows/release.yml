name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      PLUTO_MOCK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar (pacote + ruff + coverage)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install ruff coverage

      # Tag só vira release se passar os MESMOS portões do CI —
      # nada de liberar zip sem ruff + suíte + varredura + cobertura.
      - name: "Portão 1/4 — ruff (lint)"
        run: ruff check --select E9,F,B,PLE .

      - name: "Portão 2/4 — suíte (tests/run_all.py)"
        run: python tests/run_all.py
        timeout-minutes: 20

      - name: "Portão 3/4 — varredura (segredos/dados pessoais)"
        run: pluto varredura --tudo

      # V9.0.0 (F0 · RF-INF-06): mesmo gate de cobertura do CI —
      # floor 66% (ratchet), medido como o baseline.
      - name: "Portão 4/4 — cobertura (F0: floor 66%)"
        run: |
          coverage run --source=pluto tests/run_all.py
          coverage report --fail-under=66
        timeout-minutes: 20

      # Zip idêntico ao processo local: só arquivos rastreados
      # (git ls-files) — dados pessoais nunca entram.
      - name: Zip (git archive)
        run: git archive --format=zip -o "pluto-agente-${{ github.ref_name }}.zip" HEAD

      - name: GitHub Release com o zip anexado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f "docs/RELEASE-NOTES-${{ github.ref_name }}.md" ]; then
            gh release create "${{ github.ref_name }}" \
              "pluto-agente-${{ github.ref_name }}.zip" \
              --title "Pluto Agente ${{ github.ref_name }}" \
              --notes-file "docs/RELEASE-NOTES-${{ github.ref_name }}.md"
          else
            gh release create "${{ github.ref_name }}" \
              "pluto-agente-${{ github.ref_name }}.zip" \
              --title "Pluto Agente ${{ github.ref_name }}" \
              --generate-notes
          fi
